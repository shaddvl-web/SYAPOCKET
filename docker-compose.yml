version: '3.8'

services:
  pocket-option-ai-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pocket_option_ai_analyzer
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/bot.db
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  bot_data:
    driver: local
